name: API Tests
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379/0
      GEMINI_API_KEY: dummy-gemini-key
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: apps/api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run API tests
      working-directory: apps/api
      run: |
        # Deselect integration tests requiring external services:
        # - tests/test_agent.py::test_agent_graph: requires external LLM provider / Vector store
        # - tests/test_chat.py::test_chat_stream: requires auth session and LLM stream service
        # - tests/test_session.py::test_init_session: requires live PostgreSQL database
        pytest tests \
          --deselect tests/test_agent.py::test_agent_graph \
          --deselect tests/test_chat.py::test_chat_stream \
          --deselect tests/test_session.py::test_init_session
